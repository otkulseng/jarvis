[package]
name = "jarvis"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.6.7", features = ["derive", "wrap_help"] }
ctrlc = { version = "3.5.2", features = ["termination"] }
rusqlite = { version = "0.41.1", features = ["bundled"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
